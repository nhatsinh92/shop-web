# Nightly Lighthouse budgets (make lighthouse). A failed assertion opens or updates one issue.
name: lighthouse-nightly

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: lighthouse-nightly
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: make install
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Lighthouse
        id: lighthouse
        continue-on-error: true
        run: make lighthouse
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouseci
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Open or update the regression issue
        if: steps.lighthouse.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lighthouse-report-issue.sh "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Fail the run when the budgets failed
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
