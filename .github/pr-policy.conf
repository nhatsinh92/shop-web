# Path lists for .github/scripts/pr-policy.sh (bash syntax, sourced). Patterns use [[ == ]] globbing,
# where `*` also matches `/`. Changing this file is itself a protected, owner-approved change.

# Workers may not touch these without the `infra-change` label (added by the owner or planner).
# Every protected change also needs the owner's `human-approved` label in merge-gate.
PROTECTED_PATHS=(
  ".github/*"
  ".claude/*"
  "eslint.config.mjs"
  "tsconfig.json"
  "vitest.config.mts"
  "vitest.setup.ts"
  "playwright.config.ts"
  ".prettierrc.json"
  ".prettierignore"
  ".gitleaks.toml"
)

# Existing tests: modifying, renaming or deleting them is protected; adding new tests is not.
TEST_PATHS=(
  "*.test.ts"
  "*.test.tsx"
  "e2e/*"
)

# Security-sensitive code needs no owner label (owner decision 2026-11-22): it merges on `agent-approved` and green
# CI, and the reviewer applies the security checklist. Paths listed here would need `human-approved`.
SENSITIVE_PATHS=()

# shop-web consumes the contract; major bumps are detected in shop-api.
CONTRACT_PACKAGE=""
